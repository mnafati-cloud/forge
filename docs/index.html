<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forge</title>
<meta name="description" content="Suivi de musculation à la maison — séances, charges, progression.">
<meta name="theme-color" content="#14110f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
<script>
/* Thème appliqué AVANT le rendu : évite le flash clair au lancement.
   Seul endroit hors app.js qui touche au localStorage, et uniquement en lecture. */
(function () {
  try {
    var raw = localStorage.getItem('forge-state-v1');
    var t = raw ? (JSON.parse(raw).set || {}).theme : 'auto';
    if (t !== 'dark' && t !== 'light') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* état illisible : on garde le thème sombre par défaut */ }
})();
</script>
</head>
<body>

<header class="hd">
  <h1>Forge</h1>
  <span class="sp"></span>
  <span class="streak" id="streak"></span>
  <button class="icobtn" id="btnSet" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21v-6.5M5 10.5V3M12 21v-8.5M12 8.5V3M19 21v-4.5M19 12.5V3M2.5 14.5h5M9.5 10.5h5M16.5 16.5h5"/></svg></button>
</header>

<main id="view"></main>

<nav class="nav" id="nav">
  <button data-tab="ses" class="on" aria-current="page"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.25v3.5M6.75 7.25v9.5M17.25 7.25v9.5M21 10.25v3.5M6.75 12h10.5"/></svg></span>Séance</button>
  <button data-tab="his"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6.5h10.5M9.5 12h10.5M9.5 17.5h7M4 6.5h1.75M4 12h1.75M4 17.5h1.75"/></svg></span>Historique</button>
  <button data-tab="pro"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 17.5l5.5-5.5 3.5 3.5 8-8"/><path d="M14.5 7.5h6v6"/></svg></span>Progrès</button>
</nav>

<div id="rest"></div>
<div id="sheet"></div>
<div id="dlg"></div>
<div id="toast"></div>

<script src="exercises.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* hors-ligne : sans effet */ });
  });
}
</script>
</body>
</html>
